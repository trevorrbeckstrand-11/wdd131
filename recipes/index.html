<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script rel="script" src="recipes.js" defer></script>

        
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Recipe Book">
    <meta property="og:description" content="Awesome Recipes">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Recipe Book">
    <meta name="twitter:description" content="Awesome Recipes">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                    
</head>
<body>
    <header>
        <img src="images/recipe-book.png" alt="Recipe Book Image">
        <h1>RecipeBook</h1>
    </header>
    <main>
        <form class="searchbar">
            <input type="search" id="search" placeholder="Find a recipe">
            <img src="images/search.svg" id="searchicon" alt="Search Icon">
        </form>
        <hr>
        <div id="recipe-listings">
            
        </div>         
    </main>
    <footer>
        <a href="https://www.flaticon.com/free-icons/recipe" id="footer-link" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>  
        <div class="social">
            <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>                                    
    </footer>
</body>
</html>
